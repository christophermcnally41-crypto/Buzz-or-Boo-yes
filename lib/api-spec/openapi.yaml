openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: What's Coming — Cultural Prediction Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: markets
    description: Prediction markets
  - name: predictions
    description: User predictions
  - name: users
    description: User profiles and stats
  - name: leaderboard
    description: Forecaster rankings
  - name: admin
    description: Admin operations
  - name: polls
    description: Boston Says opinion polls
  - name: Auth
    description: Browser and mobile authentication endpoints.
paths:
  /polls:
    get:
      operationId: listPolls
      tags: [polls]
      summary: List open Boston Says polls
      responses:
        "200":
          description: Polls with live tally
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PollsEnvelope"

  /polls/{id}:
    get:
      operationId: getPoll
      tags: [polls]
      summary: Get a single poll with tally
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Poll with tally
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PollEnvelope"
        "404":
          description: Not found

  /polls/{id}/vote:
    post:
      operationId: voteOnPoll
      tags: [polls]
      summary: Cast a vote on a Boston Says poll
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PollVoteInput"
      responses:
        "200":
          description: Updated tally after vote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PollVoteResult"
        "400":
          description: Bad request
        "409":
          description: Poll is closed

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /markets:
    get:
      operationId: listMarkets
      tags: [markets]
      summary: List markets
      description: List prediction markets with optional filters
      parameters:
        - name: category
          in: query
          schema:
            type: string
            enum: [STYLE, HOME, CITY, REAL_ESTATE, WEATHER, CULTURE, LOCAL_PULSE, BEAUTY, ACCESSORIES, MOVIES]
        - name: status
          in: query
          schema:
            type: string
            enum: [OPEN, CLOSED, RESOLVED, ARCHIVED]
        - name: format
          in: query
          schema:
            type: string
            enum: [STANDARD, HOT_OR_NOT, HEAD_TO_HEAD, MULTI_CHOICE, BUZZ_OR_BOO, THE_CALL]
        - name: limit
          in: query
          schema:
            type: number
            default: 20
        - name: offset
          in: query
          schema:
            type: number
            default: 0
      responses:
        "200":
          description: List of markets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketList"

  /markets/trending:
    get:
      operationId: getTrendingMarkets
      tags: [markets]
      summary: Get trending markets
      description: Returns the most active markets by prediction count
      parameters:
        - name: limit
          in: query
          schema:
            type: number
            default: 10
      responses:
        "200":
          description: Trending markets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketList"

  /markets/categories:
    get:
      operationId: getMarketCategories
      tags: [markets]
      summary: Get category stats
      description: Returns market counts and activity by category
      responses:
        "200":
          description: Category breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryStat"

  /markets/{id}:
    get:
      operationId: getMarket
      tags: [markets]
      summary: Get market details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Market detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Market"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /markets/{id}/predict:
    post:
      operationId: makePrediction
      tags: [predictions]
      summary: Make a prediction on a market
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PredictionInput"
      responses:
        "201":
          description: Prediction made
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prediction"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /markets/{id}/tally:
    get:
      operationId: getMarketTally
      tags: [markets]
      summary: Get aggregate vote tallies for a market
      description: Returns the total vote count per choice key for a market, computed server-side. Use this instead of fetching all predictions for aggregate display.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Vote tallies per choice key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketTally"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /markets/{id}/my-prediction:
    get:
      operationId: getMarketMyPrediction
      tags: [predictions]
      summary: Get the current user's prediction for a market
      description: Returns the authenticated user's own prediction for this market, or null if they haven't predicted. Unauthenticated requests return null without an error.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: User's prediction or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyPredictionEnvelope"
        "400":
          description: Invalid market or user id

  /markets/{id}/predictions:
    get:
      operationId: getMarketPredictions
      tags: [predictions]
      summary: Get predictions for a market
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: List of predictions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Prediction"

  /stats/summary:
    get:
      operationId: getPlatformStats
      tags: [markets]
      summary: Get platform-wide stats
      description: Total markets, predictions, users, accuracy averages
      responses:
        "200":
          description: Platform summary stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformStats"

  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /markets/{id}/pin:
    get:
      operationId: getMarketPinStatus
      tags: [pins]
      summary: Check if current user has pinned this market
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Pin status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PinStatus"
    post:
      operationId: pinMarket
      tags: [pins]
      summary: Pin a market to your profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Pinned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PinStatus"
    delete:
      operationId: unpinMarket
      tags: [pins]
      summary: Unpin a market from your profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Unpinned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PinStatus"

  /users/{id}/pins:
    get:
      operationId: getUserPins
      tags: [pins]
      summary: Get all pinned markets for a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Pinned markets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PinnedMarketsEnvelope"

  /users/{id}/predictions:
    get:
      operationId: getUserPredictions
      tags: [predictions]
      summary: Get predictions by user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: User predictions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserPrediction"

  /leaderboard:
    get:
      operationId: getLeaderboard
      tags: [leaderboard]
      summary: Get top forecasters
      parameters:
        - name: category
          in: query
          schema:
            type: string
            enum: [STYLE, HOME, CITY, REAL_ESTATE, WEATHER, CULTURE, LOCAL_PULSE, BEAUTY, ACCESSORIES, MOVIES, OVERALL]
        - name: limit
          in: query
          schema:
            type: number
            default: 20
      responses:
        "200":
          description: Leaderboard entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

  /leaderboard/me:
    get:
      operationId: getMyLeaderboardEntry
      tags: [leaderboard]
      summary: Get the authenticated user's own leaderboard rank entry
      parameters:
        - name: category
          in: query
          schema:
            type: string
            enum: [STYLE, HOME, CITY, REAL_ESTATE, WEATHER, CULTURE, LOCAL_PULSE, BEAUTY, ACCESSORIES, MOVIES, OVERALL]
      responses:
        "200":
          description: The authenticated user's rank entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardEntry"
        "204":
          description: User has no resolved predictions in this category

  /admin/templates:
    get:
      operationId: listMarketTemplates
      tags: [admin]
      summary: Admin — list all franchise templates
      responses:
        "200":
          description: All franchise templates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketTemplateList"
    post:
      operationId: createMarketTemplate
      tags: [admin]
      summary: Admin — create a new franchise template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketTemplateInput"
      responses:
        "201":
          description: Created template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketTemplate"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/templates/{id}/create-market:
    post:
      operationId: createMarketFromTemplate
      tags: [admin]
      summary: Admin — instantiate a market from a franchise template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketFromTemplateInput"
      responses:
        "201":
          description: Created market
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Market"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Template not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/markets:
    get:
      operationId: adminListMarkets
      tags: [admin]
      summary: Admin — list all markets including drafts
      responses:
        "200":
          description: All markets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketList"
    post:
      operationId: createMarket
      tags: [admin]
      summary: Admin — create a new market
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketInput"
      responses:
        "201":
          description: Created market
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Market"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/markets/{id}:
    patch:
      operationId: patchMarket
      tags: [admin]
      summary: Admin — edit an existing market's mutable fields
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketPatch"
      responses:
        "200":
          description: Updated market
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Market"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/markets/{id}/resolve:
    patch:
      operationId: resolveMarket
      tags: [admin]
      summary: Admin — resolve a market with an outcome
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketResolution"
      responses:
        "200":
          description: Resolved market
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Market"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the returnTo path on success.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
            default: /
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/init-transaction:
    post:
      tags: [Auth]
      operationId: initMobileAuthTransaction
      summary: Generate server-side state and nonce for a mobile OIDC login
      responses:
        '200':
          description: Transaction created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileAuthTransaction'
        '500':
          description: Failed to create transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — Bearer <sid>.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    PinStatus:
      type: object
      required: [pinned]
      properties:
        pinned:
          type: boolean

    PinnedMarketsEnvelope:
      type: object
      required: [pins]
      properties:
        pins:
          type: array
          items:
            $ref: "#/components/schemas/Market"

    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Market:
      type: object
      required:
        - id
        - title
        - question
        - category
        - subcategory
        - status
        - yesCount
        - noCount
        - totalPredictions
        - createdAt
      properties:
        id:
          type: number
        title:
          type: string
        question:
          type: string
        description:
          type: ["string", "null"]
        category:
          type: string
          enum: [STYLE, HOME, CITY, REAL_ESTATE, WEATHER, CULTURE, LOCAL_PULSE, BEAUTY, ACCESSORIES, MOVIES]
        subcategory:
          type: string
        marketFormat:
          type: string
          enum: [STANDARD, HOT_OR_NOT, HEAD_TO_HEAD, MULTI_CHOICE, BUZZ_OR_BOO, THE_CALL]
        imageUrl:
          type: ["string", "null"]
        status:
          type: string
          enum: [OPEN, CLOSED, RESOLVED, ARCHIVED]
        yesCount:
          type: number
        noCount:
          type: number
        totalPredictions:
          type: number
        yesPercent:
          type: number
        noPercent:
          type: number
        resolutionSource:
          type: ["string", "null"]
        sourcePrimary:
          type: ["string", "null"]
        sourceBackup:
          type: ["string", "null"]
        baselineSnapshot:
          type: ["string", "null"]
        formula:
          type: ["string", "null"]
        voidRule:
          type: ["string", "null"]
        geo:
          type: ["string", "null"]
        closesAt:
          type: ["string", "null"]
        resolvedAt:
          type: ["string", "null"]
        resolvedOutcome:
          type: ["string", "null"]
        createdAt:
          type: string
        clockType:
          type: string
          enum: [EVERGREEN, SEASONAL, NOW, EVENT_DRIVEN, ROLLING_FORECAST, RECURRING_PULSE]
          description: "Market Bible v0.5 §40 clock type controlling freshness and expiry behaviour"
        publishAt:
          type: ["string", "null"]
          description: "ISO timestamp when this market becomes publicly visible; null = immediately visible"
        peakUntil:
          type: ["string", "null"]
          description: "ISO timestamp marking the end of the peak-freshness window"
        expireAt:
          type: ["string", "null"]
          description: "ISO timestamp for hard expiry; null = never expires (EVERGREEN)"
        refreshRule:
          type: ["string", "null"]
          description: "Recurrence cadence for RECURRING_PULSE markets (e.g. MONTHLY, WEEKLY)"
        freshnessScore:
          type: ["number", "null"]
          description: "0–100 freshness score recomputed by the clock worker; 100 = fully fresh"
        seriesId:
          type: ["number", "null"]
          description: "ID of the root market in a recurring series"
        templateId:
          type: ["number", "null"]
          description: "ID of the franchise template this market was created from"

    MarketList:
      type: object
      required:
        - markets
        - total
      properties:
        markets:
          type: array
          items:
            $ref: "#/components/schemas/Market"
        total:
          type: number

    CategoryStat:
      type: object
      required:
        - category
        - totalMarkets
        - openMarkets
        - totalPredictions
      properties:
        category:
          type: string
        totalMarkets:
          type: number
        openMarkets:
          type: number
        totalPredictions:
          type: number

    User:
      type: object
      required:
        - id
        - username
        - tokenBalance
        - totalPredictions
        - totalResolved
        - createdAt
      properties:
        id:
          type: number
        username:
          type: string
        email:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        tokenBalance:
          type: number
        totalPredictions:
          type: number
        totalResolved:
          type: number
        totalCorrect:
          type: number
        overallAccuracy:
          type: ["number", "null"]
        styleAccuracy:
          type: ["number", "null"]
        homeAccuracy:
          type: ["number", "null"]
        cityAccuracy:
          type: ["number", "null"]
        realEstateAccuracy:
          type: ["number", "null"]
        weatherAccuracy:
          type: ["number", "null"]
        cultureAccuracy:
          type: ["number", "null"]
        buzzScore:
          type: ["number", "null"]
          description: 0–100 BuzzScore (Brier-style calibration metric). Null until the user has at least one resolved prediction.
        rank:
          type: ["number", "null"]
        lastTopupAt:
          type: ["string", "null"]
          description: ISO timestamp of the last daily top-up, or null if never topped up
        createdAt:
          type: string

    MyPredictionEnvelope:
      type: object
      required:
        - prediction
      properties:
        prediction:
          oneOf:
            - $ref: "#/components/schemas/Prediction"
            - type: "null"

    Prediction:
      type: object
      required:
        - id
        - userId
        - marketId
        - choice
        - amount
        - createdAt
      properties:
        id:
          type: number
        userId:
          type: number
        marketId:
          type: number
        choice:
          type: string
          description: "YES or NO for standard markets; contender key (A–E) for MULTI_CHOICE markets"
        amount:
          type: number
        isCorrect:
          type: ["boolean", "null"]
        tokensEarned:
          type: ["number", "null"]
        createdAt:
          type: string

    UserPrediction:
      type: object
      required:
        - id
        - userId
        - marketId
        - choice
        - amount
        - createdAt
      properties:
